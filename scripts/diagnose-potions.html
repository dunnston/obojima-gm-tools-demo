<!DOCTYPE html>
<html>
<head>
    <title>Diagnose Potion Issue</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .button { padding: 10px 15px; margin: 5px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .info { background-color: #17a2b8; color: white; }
        .danger { background-color: #dc3545; color: white; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; font-size: 12px; }
        .log { border: 1px solid #ddd; padding: 10px; background: white; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <h1>🔍 Diagnose Potion Issue</h1>
    
    <div class="section">
        <h2>1. Check Current State</h2>
        <button class="button info" onclick="checkAll()">🔍 Run Full Diagnosis</button>
        <button class="button danger" onclick="clearAll()">🗑️ Clear Everything</button>
    </div>
    
    <div class="section">
        <h2>2. LocalStorage Analysis</h2>
        <div id="localStorage-analysis"></div>
    </div>
    
    <div class="section">
        <h2>3. API Response Check</h2>
        <div id="api-analysis"></div>
    </div>
    
    <div class="section">
        <h2>4. Recommendations</h2>
        <div id="recommendations"></div>
    </div>
    
    <script>
        async function checkAll() {
            checkLocalStorage();
            await checkAPI();
            generateRecommendations();
        }
        
        function checkLocalStorage() {
            const localDiv = document.getElementById('localStorage-analysis');
            localDiv.innerHTML = '<h3>📦 LocalStorage Contents:</h3>';
            
            // Check modifiedPotions
            const modifiedPotions = localStorage.getItem('modifiedPotions');
            if (modifiedPotions) {
                try {
                    const potions = JSON.parse(modifiedPotions);
                    localDiv.innerHTML += `<div class="log">
                        <h4>modifiedPotions (${potions.length} items):</h4>
                        <table>
                            <tr><th>Name</th><th>Number</th><th>ID</th><th>Rabbit?</th></tr>
                            ${potions.map(p => `
                                <tr>
                                    <td>${p.name}</td>
                                    <td>${p.number}</td>
                                    <td>${p.id || 'null'}</td>
                                    <td>${p.name.toLowerCase().includes('rabbit') ? '🐰 YES' : 'No'}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>`;
                } catch (e) {
                    localDiv.innerHTML += `<div class="log">Error parsing modifiedPotions: ${e.message}</div>`;
                }
            } else {
                localDiv.innerHTML += '<div class="log">✅ No modifiedPotions in localStorage</div>';
            }
            
            // Check for any obojima-demo keys
            const demoKeys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.includes('obojima-demo')) {
                    demoKeys.push(key);
                }
            }
            
            if (demoKeys.length > 0) {
                localDiv.innerHTML += `<div class="log">⚠️ Found ${demoKeys.length} demo mode keys: ${demoKeys.join(', ')}</div>`;
            }
        }
        
        async function checkAPI() {
            const apiDiv = document.getElementById('api-analysis');
            apiDiv.innerHTML = '<h3>🌐 API Response:</h3>';
            
            try {
                const response = await fetch('/api/user-potions');
                const data = await response.json();
                
                if (data.potions) {
                    apiDiv.innerHTML += `<div class="log">
                        <h4>API returned ${data.potions.length} potions:</h4>
                        <table>
                            <tr><th>Name</th><th>Number</th><th>ID</th><th>Rabbit?</th></tr>
                            ${data.potions.map(p => `
                                <tr>
                                    <td>${p.name}</td>
                                    <td>${p.number}</td>
                                    <td>${p.id || 'null'}</td>
                                    <td>${p.name.toLowerCase().includes('rabbit') ? '🐰 YES' : 'No'}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>`;
                } else {
                    apiDiv.innerHTML += '<div class="log">❌ No potions data in API response</div>';
                }
            } catch (e) {
                apiDiv.innerHTML += `<div class="log">❌ API Error: ${e.message}</div>`;
            }
        }
        
        function generateRecommendations() {
            const recDiv = document.getElementById('recommendations');
            recDiv.innerHTML = '<h3>💡 Analysis & Recommendations:</h3>';
            
            const modifiedPotions = localStorage.getItem('modifiedPotions');
            let localCount = 0;
            let hasNullIds = false;
            
            if (modifiedPotions) {
                try {
                    const potions = JSON.parse(modifiedPotions);
                    localCount = potions.length;
                    hasNullIds = potions.some(p => !p.id || p.id === null);
                } catch (e) {}
            }
            
            recDiv.innerHTML += '<div class="log">';
            
            if (hasNullIds) {
                recDiv.innerHTML += '<p>⚠️ <strong>Found potions with null IDs</strong> - This is the root cause!</p>';
                recDiv.innerHTML += '<p>When potions have null IDs, every edit creates a new database entry.</p>';
            }
            
            if (localCount > 0) {
                recDiv.innerHTML += `<p>📦 LocalStorage has ${localCount} modified potions cached</p>`;
            }
            
            recDiv.innerHTML += '<h4>Recommended Fix:</h4>';
            recDiv.innerHTML += '<ol>';
            recDiv.innerHTML += '<li>Clear localStorage (use button below)</li>';
            recDiv.innerHTML += '<li>Restart your app</li>';
            recDiv.innerHTML += '<li>The fixed code should now assign proper IDs to potions</li>';
            recDiv.innerHTML += '</ol>';
            recDiv.innerHTML += '</div>';
        }
        
        function clearAll() {
            if (confirm('Clear ALL potion-related data from localStorage?')) {
                localStorage.removeItem('modifiedPotions');
                localStorage.removeItem('modifiedIngredients');
                localStorage.removeItem('modifiedCreatures');
                localStorage.removeItem('modifiedMagicItems');
                
                // Also clear any demo keys
                const keysToDelete = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.includes('obojima')) {
                        keysToDelete.push(key);
                    }
                }
                
                keysToDelete.forEach(key => localStorage.removeItem(key));
                
                alert('✅ Cleared all Obojima data from localStorage. Please restart your app.');
                checkAll();
            }
        }
        
        // Auto-run on load
        window.onload = checkAll;
    </script>
</body>
</html>
