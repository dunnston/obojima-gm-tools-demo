<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="w-full h-full">
  <defs>
    <linearGradient id="magicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCD34D;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#1E293B" rx="20"/>
  
  <!-- Magic item silhouette (crystal/gem) -->
  <g transform="translate(100, 100)">
    <!-- Main gem body -->
    <path d="M0,-40 L25,-20 L30,0 L15,35 L-15,35 L-30,0 L-25,-20 Z" fill="url(#magicGradient)" opacity="0.8"/>
    
    <!-- Top facet -->
    <path d="M0,-40 L25,-20 L0,-10 L-25,-20 Z" fill="url(#magicGradient)"/>
    
    <!-- Side facets -->
    <path d="M25,-20 L30,0 L0,-10 Z" fill="url(#magicGradient)" opacity="0.6"/>
    <path d="M-25,-20 L-30,0 L0,-10 Z" fill="url(#magicGradient)" opacity="0.6"/>
    
    <!-- Sparkles -->
    <g fill="#FCD34D" opacity="0.9">
      <path d="M-35,-15 L-32,-12 L-35,-9 L-38,-12 Z"/>
      <path d="M35,15 L38,18 L35,21 L32,18 Z"/>
      <path d="M-20,25 L-17,28 L-20,31 L-23,28 Z"/>
      <circle cx="40" cy="-25" r="1.5"/>
      <circle cx="-45" cy="20" r="1"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="100" y="170" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="14" font-weight="500">
    Default Magic Item
  </text>
</svg>