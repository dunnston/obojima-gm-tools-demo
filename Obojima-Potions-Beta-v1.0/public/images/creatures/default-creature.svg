<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="w-full h-full">
  <defs>
    <linearGradient id="dragonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#1E293B" rx="20"/>
  
  <!-- Dragon silhouette -->
  <g transform="translate(100, 100)">
    <!-- Body -->
    <ellipse cx="0" cy="10" rx="45" ry="25" fill="url(#dragonGradient)" opacity="0.8"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="-20" rx="30" ry="20" fill="url(#dragonGradient)"/>
    
    <!-- Wings -->
    <path d="M-40,0 Q-70,-30 -45,-50 Q-20,-40 -30,0 Z" fill="url(#dragonGradient)" opacity="0.6"/>
    <path d="M40,0 Q70,-30 45,-50 Q20,-40 30,0 Z" fill="url(#dragonGradient)" opacity="0.6"/>
    
    <!-- Tail -->
    <path d="M35,20 Q50,40 65,45 Q60,50 45,35 Q40,25 35,20 Z" fill="url(#dragonGradient)" opacity="0.7"/>
    
    <!-- Eyes -->
    <circle cx="-10" cy="-25" r="3" fill="#FCD34D"/>
    <circle cx="10" cy="-25" r="3" fill="#FCD34D"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="170" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="14" font-weight="500">
    Default Creature
  </text>
</svg>